# Wei TR-181 Validation Rules
# Broadband Forum TR-181 Device Data Model validation rules

name: "Wei TR-181 Metrics"
description: "Validation rules for TR-181 device data model metrics"
version: "1.0"

rules:
  - name: "TR-181 Baseline TP-Link"
    description: "Baseline metrics required for wei v1"
    category: "Bulkdata"
    patterns:
      - "Device.DeviceInfo.UpTime"
      - "Device.DeviceInfo.SerialNumber"
      - "Device.DeviceInfo.Manufacturer"
      - "Device.DeviceInfo.ManufacturerOUI"
      - "Device.DeviceInfo.ModelName"
      - "Device.DeviceInfo.Description"
      - "Device.DeviceInfo.ProductClass"
      - "Device.DeviceInfo.HardwareVersion"
      - "Device.DeviceInfo.SoftwareVersion"
      - "Device.DeviceInfo.MemoryStatus.Free"
      - "Device.DeviceInfo.MemoryStatus.Total"
      - "Device.DeviceInfo.ProcessStatus.CPUUsage"
      - "Device.ManagementServer.ConnectionRequestURL"
      - "Device.Firewall.Enable"
      - "Device.WiFi.Radio.*.Enable"
      - "Device.WiFi.Radio.*.Channel"
      - "Device.WiFi.Radio.*.Status"
      - "Device.WiFi.Radio.*.CurrentOperatingChannelBandwidth"
      - "Device.WiFi.Radio.*.OperatingFrequencyBand"
      - "Device.WiFi.Radio.*.OperatingChannelBandwidth"
      - "Device.WiFi.Radio.*.OperatingStandards"
      - "Device.WiFi.Radio.*.SupportedStandards"
      - "Device.WiFi.Radio.*.AutoChannelEnable"
      - "Device.WiFi.Radio.*.AutoChannelSupported"
      - "Device.WiFi.Radio.*.TransmitPower"
      - "Device.WiFi.Radio.*.Stats.Noise"
      - "Device.WiFi.DataElements.Network.Device.*.Radio.*.Noise"
      - "Device.WiFi.DataElements.Network.Device.*.Radio.*.Utilization"
      - "Device.WiFi.Radio.*.Stats.BytesSent"
      - "Device.WiFi.Radio.*.Stats.BytesReceived"
      - "Device.WiFi.Radio.*.Stats.PacketsSent"
      - "Device.WiFi.Radio.*.Stats.PacketsReceived"
      - "Device.WiFi.Radio.*.Stats.ErrorsSent"
      - "Device.WiFi.Radio.*.Stats.ErrorsReceived"
      - "Device.WiFi.Radio.*.Stats.DiscardPacketsSent"
      - "Device.WiFi.Radio.*.Stats.DiscardPacketsReceived"
      - "Device.WiFi.DataElements.Network.Device.*.Radio.*.BSS.*.SSID"
      - "Device.WiFi.DataElements.Network.Device.*.Radio.*.BSS.*.STA.*.MACAddress"
      - "Device.WiFi.DataElements.Network.Device.*.Radio.*.BSS.*.STA.*.BytesSent"
      - "Device.WiFi.DataElements.Network.Device.*.Radio.*.BSS.*.STA.*.BytesReceived"
      - "Device.WiFi.DataElements.Network.Device.*.Radio.*.BSS.*.STA.*.LastConnectTime"
      - "Device.WiFi.DataElements.Network.Device.*.Radio.*.BSS.*.STA.*.LastDataDownlinkRate"
      - "Device.WiFi.DataElements.Network.Device.*.Radio.*.BSS.*.STA.*.LastDataUplinkRate"
      - "Device.WiFi.SSID.*.SSID"
      - "Device.WiFi.SSID.*.LowerLayers"
      - "Device.WiFi.AccessPoint.*.Enable"
      - "Device.WiFi.AccessPoint.*.Status"
      - "Device.WiFi.AccessPoint.*.SSIDReference"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.MACAddress"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.SignalStrength"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.OperatingStandard"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.LastDataUplinkRate"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.LastDataDownlinkRate"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.Stats.BytesSent"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.Stats.ErrorsSent"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.Stats.RetryCount"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.Stats.PacketsSent"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.Stats.RetransCount"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.Stats.BytesReceived"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.Stats.ErrorsReceived"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.Stats.PacketsReceived"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.Stats.FailedRetransCount"
      - "Device.WiFi.AccessPoint.*.AssociatedDevice.*.Stats.MultipleRetryCount"
      - "Device.WiFi.X_TP_BandSteering.Enable"
      - "Device.Hosts.Host.*.Active"
      - "Device.Hosts.Host.*.ClientID"
      - "Device.Hosts.Host.*.HostName"
      - "Device.Hosts.Host.*.IPAddress"
      - "Device.Hosts.Host.*.PhysAddress"
      - "Device.Hosts.Host.*.InterfaceType"
      - "Device.WiFi.Radio.*.ChannelsInUse"

  - name: "Cellular Interface Metrics"
    description: "Cellular interface configuration and status metrics"
    category: "Cellular"
    patterns:
      - "Device.Cellular.Interface.*.Alias"
      - "Device.Cellular.Interface.*.CurrentAccessTechnology"
      - "Device.Cellular.Interface.*.Enable"
      - "Device.Cellular.Interface.*.IMEI"
      - "Device.Cellular.Interface.*.NetworkInUse"
      - "Device.Cellular.Interface.*.PreferredAccessTechnology"
      - "Device.Cellular.Interface.*.RSSI"
      - "Device.Cellular.Interface.*.Status"
      - "Device.Cellular.Interface.*.SupportedAccessTechnologies"
      - "Device.Cellular.Interface.*.USIM.ICCID"
      - "Device.Cellular.Interface.*.USIM.IMSI"
      - "Device.Cellular.Interface.*.USIM.MSISDN"
      - "Device.Cellular.Interface.*.USIM.PIN"
      - "Device.Cellular.Interface.*.USIM.PINCheck"
      - "Device.Cellular.Interface.*.USIM.Status"
      - "Device.Cellular.Interface.*.X_TP_LTEInterfaceConfig.CurConnTime"
      - "Device.Cellular.Interface.*.X_TP_LTEInterfaceConfig.CurRxSpeed"
      - "Device.Cellular.Interface.*.X_TP_LTEInterfaceConfig.CurStatistics"
      - "Device.Cellular.Interface.*.X_TP_LTEInterfaceConfig.CurTxSpeed"
      - "Device.Cellular.Interface.*.X_TP_LTEInterfaceConfig.CurrentDate"
      - "Device.Cellular.Interface.*.X_TP_LTEInterfaceConfig.DailyFlow"
      - "Device.Cellular.Interface.*.X_TP_LTEInterfaceConfig.TotalConnTime"
      - "Device.Cellular.Interface.*.X_TP_LTEInterfaceConfig.TotalStatistics"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ConnectedBand"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.NetworkType"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.CGI"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.CQI"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.CellConnectionStatus"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.Cid"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.DownBandWidth"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.DownFreq"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.RSRP"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.RSRQ"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.RSSI"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.SNR"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.SSRSRP"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.SSRSRQ"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.SSSINR"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.SignalStrength"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.TAC"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.TxPowerPUCCH"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.UpBandWidth"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.ServingCellInfo.*.UpFreq"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.SignalStrength"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.SimLock.Pin"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.WanCfg.NetworkPreferredModeOptionList"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.WanCfg.NetworkPreferredModeSelected"
      - "Device.Cellular.Interface.*.X_TP_WANLTELinkConfig.WanCfg.ProfStat.IspName"

  - name: "IP Interface Metrics"
    description: "IP interface configuration and statistics metrics"
    category: "IP Interface"
    patterns:
      - "Device.IP.Interface.*.Alias"
      - "Device.IP.Interface.*.Enable"
      - "Device.IP.Interface.*.IPv4Address.*.AddressingType"
      - "Device.IP.Interface.*.IPv4Address.*.Enable"
      - "Device.IP.Interface.*.IPv4Address.*.IPAddress"
      - "Device.IP.Interface.*.IPv4Address.*.Status"
      - "Device.IP.Interface.*.IPv4Enable"
      - "Device.IP.Interface.*.IPv6Enable"
      - "Device.IP.Interface.*.LowerLayers"
      - "Device.IP.Interface.*.Stats.BytesReceived"
      - "Device.IP.Interface.*.Stats.BytesSent"
      - "Device.IP.Interface.*.Stats.ErrorsReceived"
      - "Device.IP.Interface.*.Stats.ErrorsSent"
      - "Device.IP.Interface.*.Stats.PacketsReceived"
      - "Device.IP.Interface.*.Stats.PacketsSent"
      - "Device.IP.Interface.*.Stats.X_TP_BytesReceivedLast"
      - "Device.IP.Interface.*.Stats.X_TP_BytesSentLast"
      - "Device.IP.Interface.*.Stats.X_TP_LastPeriod"
      - "Device.IP.Interface.*.Stats.X_TP_PacketsReceivedLast"
      - "Device.IP.Interface.*.Stats.X_TP_PacketsSentLast"
      - "Device.IP.Interface.*.Stats.X_TP_RxThroughput"
      - "Device.IP.Interface.*.Stats.X_TP_TxThroughput"
      - "Device.IP.Interface.*.Status"
      - "Device.IP.Interface.*.X_TP_ConnType"

  - name: "Routing Metrics"
    description: "Routing configuration and forwarding metrics"
    category: "Routing"
    patterns:
      - "Device.Routing.Router.*.IPv4Forwarding.*.DestIPAddress"
      - "Device.Routing.Router.*.IPv4Forwarding.*.DestSubnetMask"
      - "Device.Routing.Router.*.IPv4Forwarding.*.Enable"
      - "Device.Routing.Router.*.IPv4Forwarding.*.ForwardingMetric"
      - "Device.Routing.Router.*.IPv4Forwarding.*.ForwardingPolicy"
      - "Device.Routing.Router.*.IPv4Forwarding.*.GatewayIPAddress"
      - "Device.Routing.Router.*.IPv4Forwarding.*.Interface"
      - "Device.Routing.Router.*.IPv4Forwarding.*.StaticRoute"
      - "Device.Routing.Router.*.IPv4Forwarding.*.Status"